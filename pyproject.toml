[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-code-validator"
version = "0.5.1"
description = "PatchCourt compatibility evidence and ACV source review"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ACV Contributors" }]
keywords = ["code-review", "reviewer-agent", "llm", "cli", "openai-compatible"]
dependencies = ["openai>=1.30,<3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
acv = "acv.cli:main"
patchcourt = "patchcourt.cli:main"

[tool.setuptools.packages.find]
include = ["acv*", "patchcourt*"]

[tool.setuptools.package-data]
patchcourt = ["web/*.html", "fixtures/*.txt", "fixtures/*LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
