name: PatchCourt compatibility gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest==8.4.2
      - run: python -m pytest
      - run: python -m patchcourt demo --output evidence/ci
      - run: python -m unittest discover -s evidence/ci -p test_regression.py
      - run: python -m patchcourt benchmark --output evidence/ci-benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-evidence-${{ matrix.python }}
          path: evidence/ci*
  installed-sdk:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/verify_sdk_upgrade.py --environment-dir outputs/sdk-environments --output evidence/ci-sdk-upgrade --prepare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-sdk-${{ matrix.os }}
          path: evidence/ci-sdk-upgrade
